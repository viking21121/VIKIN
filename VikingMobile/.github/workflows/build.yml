name: Compilar Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar el workload de MAUI para Android
        run: dotnet workload install maui-android

      - name: Restaurar dependencias
        run: dotnet restore VikingMobile.csproj

      - name: Compilar
        run: dotnet build VikingMobile.csproj -f net10.0-android -c Release --no-restore
